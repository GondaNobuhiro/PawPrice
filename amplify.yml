version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend && npm ci
    build:
      commands:
        - npx prisma generate
        - npm run build
        - cd /codebuild/output/src$(ls /codebuild/output/ | grep src | head -1)/src/pawprice 2>/dev/null || cd $(git rev-parse --show-toplevel)
        - ln -sf frontend/.next .next 2>/dev/null || true
        - ln -sf frontend/next.config.ts next.config.ts 2>/dev/null || true
        - ls -la .next .amplify-hosting 2>/dev/null || echo "checking dirs"
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
      - frontend/.next/cache/**/*
